<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="g2" x1="10" y1="10" x2="38" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Flask body with code bracket integration -->
  <g filter="url(#glow)">
    <!-- Flask neck -->
    <path d="M20 4 L20 14 L28 14 L28 4" stroke="url(#g1)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Flask body - geometric/angular style -->
    <path d="M20 14 L8 38 Q7 40 9 42 L39 42 Q41 40 40 38 L28 14" stroke="url(#g1)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Code brackets inside flask -->
    <!-- Left bracket < -->
    <path d="M21 26 L15 31 L21 36" stroke="url(#g2)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right bracket > -->
    <path d="M27 26 L33 31 L27 36" stroke="url(#g2)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash / -->
    <path d="M26 25 L22 37" stroke="url(#g2)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>
</svg>